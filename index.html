<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meri Piyari Madam Jee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500;1,700&family=Caveat:wght@500;700&family=Special+Elite&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf7f1; --grid:rgba(160,150,135,.13); --red:#c81e3c; --deep:#8f1228; --pink:#e56a96; --ink:#3a2c28; --muted:#8a7068;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--cream);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;overflow-x:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

.page{
  min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(26px + env(safe-area-inset-top,0px)) 16px calc(34px + env(safe-area-inset-bottom,0px));
  position:relative;overflow:hidden;
}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin:0}
h1{
  font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(1.7rem,8vw,2.6rem);white-space:nowrap;
  color:var(--deep);margin:6px 0 0;text-align:center;line-height:1.1;
  animation:fin 1.1s ease both;
}
h1 span{color:var(--pink)}
@keyframes fin{from{opacity:0;transform:translateY(12px)}}

/* bouquet */
.bq{width:min(78vw,310px);margin:8px 0 0;filter:drop-shadow(0 18px 22px rgba(80,20,30,.25));animation:sway 6s ease-in-out infinite;transform-origin:50% 100%}
.bq svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes sway{50%{transform:rotate(1.2deg)}}
.bl{transform-box:fill-box;transform-origin:center;animation:bloom 1.1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes bloom{from{transform:scale(0) rotate(-40deg);opacity:0}}

/* envelope */
.stage{position:relative;margin-top:-26px;z-index:3;animation:rise 1s 2.2s ease both}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(-4deg)}}
.env{width:250px;height:156px;perspective:900px;transform:rotate(-4deg);cursor:pointer}
.flip{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.turned{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  background:linear-gradient(135deg,#efe1cd,#e2cfb4);box-shadow:0 14px 26px rgba(80,40,30,.28),inset 0 0 0 1px rgba(120,90,60,.15);
}
.face::after{content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .3  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.front .to{position:absolute;left:20px;right:76px;top:44px;font-family:Caveat,cursive;font-size:1.12rem;line-height:1.15;color:#4a342c;white-space:nowrap}
.front .to small{display:block;font-size:.95rem;color:#8a6a5a}
.front .to.t2{top:96px}
.front .line{position:absolute;left:20px;right:84px;height:1px;background:rgba(90,60,40,.3)}
.stamps{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.stamp{width:30px;height:38px;background:#fff8ee;border:2px dotted #c9a889;display:grid;place-items:center;font-size:1.05rem;transform:rotate(3deg)}
.pm{position:absolute;right:10px;top:78px;width:46px;height:46px;border:2px solid rgba(120,60,50,.35);border-radius:50%;display:grid;place-items:center;font-size:.46rem;letter-spacing:.1em;color:rgba(120,60,50,.5);transform:rotate(-14deg);font-weight:700;text-align:center;line-height:1.3}
.turn{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:#fff;border-radius:99px;padding:6px 12px;font-size:.62rem;letter-spacing:.12em;font-weight:700;color:var(--muted);box-shadow:0 5px 12px rgba(0,0,0,.14);white-space:nowrap}
.back{transform:rotateY(180deg)}
.flap{position:absolute;inset:0;background:linear-gradient(160deg,#e6d4ba,#d3bd9e);clip-path:polygon(0 0,100% 0,50% 64%);transform-origin:50% 0;transition:transform .6s ease;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.back.open .flap{transform:rotateX(180deg)}
.seal{
  position:absolute;left:50%;top:52%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ef5a72,#a3122f 70%);box-shadow:0 5px 10px rgba(80,0,10,.45),inset 0 -3px 5px rgba(0,0,0,.25);
  display:grid;place-items:center;color:#ffd9de;font-size:1.4rem;transition:opacity .4s,transform .4s;
  animation:pulse 1.8s ease-in-out infinite;
}
.back.open .seal{opacity:0;transform:scale(.4);animation:none}
@keyframes pulse{50%{transform:scale(1.08)}}
.hint{margin-top:22px;font-size:.7rem;letter-spacing:.18em;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;min-height:1.2em}

/* petals */
#petals{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.pt{position:absolute;top:-8vh;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}

/* letter overlay */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 14px;
  background:rgba(48,20,28,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
.ov.on{opacity:1;visibility:visible}
.sheet{
  position:relative;width:min(100%,430px);max-height:80vh;overflow-y:auto;padding:50px 28px 34px;border-radius:4px;
  background-color:#f4ede0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.018 0.024' numOctaves='4' seed='4'/><feDiffuseLighting lighting-color='%23fffdf8' surfaceScale='3.2'><feDistantLight azimuth='45' elevation='62'/></feDiffuseLighting></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>");
  box-shadow:0 24px 50px rgba(0,0,0,.4);transform:translateY(30px) rotate(-1deg);transition:transform .8s cubic-bezier(.2,.9,.3,1);
}
.ov.on .sheet{transform:none}
.tape{position:absolute;top:8px;left:50%;width:84px;height:26px;background:rgba(230,205,170,.85);transform:translateX(-50%) rotate(-3deg);box-shadow:0 2px 4px rgba(0,0,0,.15)}
.heart3d{position:absolute;right:16px;top:10px;width:54px;transform:rotate(12deg);filter:drop-shadow(0 4px 4px rgba(120,0,20,.35))}
.mini{display:block;width:44px;opacity:.75;margin:20px 0 0}
.sheet h2{font-family:"Special Elite",monospace;font-weight:400;font-size:1.05rem;margin:0 0 16px;color:#2b201b}
.sheet p{font-family:"Special Elite","Courier New",monospace;font-size:.93rem;line-height:1.75;margin:0 0 16px;color:#3a2e28;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s}
.sheet p.show{opacity:1;transform:none}
.sheet p b{font-weight:400;color:var(--deep);background:linear-gradient(transparent 62%,rgba(229,106,150,.3) 0)}
.sheet .sig{margin-top:22px;text-align:right}
.close{background:#fff;border:0;border-radius:99px;padding:12px 22px;font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--deep);text-transform:uppercase;box-shadow:0 8px 18px rgba(0,0,0,.25)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>

<main class="page">
  <p class="eyebrow">Sirf aap ke liye</p>
  <h1 id="title">Meri Piyari <span>Madam Jee</span></h1>

  <div class="bq" id="bq" aria-label="Phoolon ka guldasta"></div>

  <div class="stage">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Envelope">
      <span class="turn" id="turn">TAP TO TURN OVER</span>
      <div class="flip" id="flip">
        <div class="face front">
          <div class="stamps"><div class="stamp">&#127801;</div><div class="stamp">&#10084;&#65039;</div></div>
          <div class="pm">FOR<br>YOU<br>&#10084;</div>
          <div class="to"><small>To:</small><span id="toName"></span></div>
          <div class="line" style="top:84px"></div>
          <div class="to t2"><small>From:</small><span id="fromName"></span></div>
          <div class="line" style="top:136px"></div>
        </div>
        <div class="face back" id="back">
          <div class="flap"></div>
          <div class="seal">&#10084;</div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint"></div>
</main>

<div class="ov" id="ov">
  <div class="sheet" id="sheet">
    <div class="tape"></div>
    <svg class="heart3d" viewBox="0 0 100 92" aria-hidden="true"><defs><radialGradient id="hg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ff7d94"/><stop offset="1" stop-color="#c0112f"/></radialGradient></defs><path d="M50 88C10 60 2 32 22 16c14-10 24-2 28 10 4-12 14-20 28-10 20 16 12 44-28 72z" fill="url(#hg)"/><ellipse cx="30" cy="28" rx="9" ry="5" fill="#fff" opacity=".55" transform="rotate(-35 30 28)"/></svg>
    <h2>Sirf aap ke liye</h2>
    <div id="letter"></div>
    <svg class="mini" viewBox="0 0 60 44" aria-hidden="true"><rect x="3" y="4" width="54" height="36" rx="3" fill="none" stroke="#5a4a42" stroke-width="2"/><path d="M3 6l27 20L57 6" fill="none" stroke="#5a4a42" stroke-width="2"/></svg>
  </div>
  <button class="close" id="close">&larr; Wapas guldaste par</button>
</div>

<script>
/* ====== YAHAN APNI MARZI SE BADLEIN ====== */
var CFG = {
  to: "Meri Piyari Madam Jee",
  from: "Namuna",
  letter: [
    "Meri Piyari Madam Jee,",
    "Aaj main bas aap ko yeh bataana chahta hoon ke aap meri zindagi mein kitni khaas hain.",
    "Aap ki <b>muskurahat</b> aisi hai jaise andheray mein achanak roshni ho jaye. Jab aap muskurati hain to lagta hai waqt thehar gaya hai, aur saari thakan, saari fikrein kisi door jagah chali jati hain. Woh muskurahat meri sab se pyari dua hai.",
    "Aap ki <b>aankhein noor ki tarah</b> hain, jin mein jhaankne par sukoon bhi milta hai aur roshni bhi. Un mein aisi gehrai aur aisi sachchai hai ke baat kahe bina bhi seedha dil tak pahunch jati hai.",
    "Aap sirf khoobsurat nahi, aap <b>lajawab</b> hain. Aap ka naram dil, aap ka sabr, aap ka andaaz, sab kuch alag hai, sab kuch be-misaal. Aap jaisa koi doosra nahi.",
    "Allah aap ki muskurahat ko hamesha salamat rakhe, aur aap ke har din ko khushiyon se bhar de."
  ],
  sign: "Aap ka Namuna, aap ki smile dekhne ka muntazir hai."
};
/* ========================================= */

var $=function(s){return document.querySelector(s)};
$('#toName').textContent=CFG.to; $('#fromName').textContent=CFG.from;

/* ---------- flowers ---------- */
function rose(x,y,r,pal,d){
  var dk=pal[0],bs=pal[1],lt=pal[2],s='<g transform="translate('+x+' '+y+')"><g class="bl" style="animation-delay:'+d+'s">';
  for(var i=0;i<7;i++)s+='<ellipse cx="0" cy="'+(-r*.56)+'" rx="'+(r*.5)+'" ry="'+(r*.6)+'" fill="'+bs+'" stroke="'+dk+'" stroke-width="1" transform="rotate('+(i*51.4)+')"/>';
  for(var j=0;j<5;j++)s+='<ellipse cx="0" cy="'+(-r*.36)+'" rx="'+(r*.36)+'" ry="'+(r*.44)+'" fill="'+lt+'" stroke="'+dk+'" stroke-width=".8" transform="rotate('+(j*72+22)+')"/>';
  s+='<circle r="'+(r*.3)+'" fill="'+bs+'" stroke="'+dk+'" stroke-width="1"/>';
  s+='<path d="M'+(-r*.2)+' '+(r*.02)+' a'+(r*.2)+' '+(r*.2)+' 0 1 1 '+(r*.22)+' '+(r*.2)+' a'+(r*.1)+' '+(r*.1)+' 0 1 1 '+(-r*.12)+' '+(-r*.14)+'" fill="none" stroke="'+dk+'" stroke-width="1.6" stroke-linecap="round"/>';
  s+='<ellipse cx="'+(-r*.3)+'" cy="'+(-r*.5)+'" rx="'+(r*.2)+'" ry="'+(r*.1)+'" fill="#fff" opacity=".3" transform="rotate(-30)"/>';
  return s+'</g></g>';
}
function daisy(x,y,r,d){
  var s='<g transform="translate('+x+' '+y+')"><g class="bl" style="animation-delay:'+d+'s">';
  for(var i=0;i<12;i++)s+='<ellipse cx="0" cy="'+(-r*.62)+'" rx="'+(r*.2)+'" ry="'+(r*.42)+'" fill="'+(i%2?'#fff':'#ffe3ec')+'" stroke="#f3a9c0" stroke-width=".8" transform="rotate('+(i*30)+')"/>';
  return s+'<circle r="'+(r*.26)+'" fill="#f7c948" stroke="#d9a21c" stroke-width="1"/><circle r="'+(r*.12)+'" fill="#e8962a"/></g></g>';
}
var RED=['#7d0f24','#c81e3c','#e0394f'], RED2=['#8f1228','#a3122f','#d6334a'], PINK=['#c9487a','#e56a96','#f7a8c4'], PINK2=['#d8668f','#f08fb0','#fbc4d6'];
var heads=[
  [95,112,30,'r',RED],[150,92,32,'r',PINK],[207,114,30,'r',RED2],
  [58,152,28,'d'],[113,152,32,'r',PINK2],[187,152,32,'r',RED],[243,154,27,'d'],
  [80,202,31,'r',RED2],[137,200,34,'r',PINK],[196,204,31,'r',RED]
];
function bouquet(){
  var s='<svg viewBox="0 0 300 430" aria-hidden="true"><defs>'
   +'<pattern id="dm" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H20M0 0V20" stroke="#6a6a72" stroke-width=".9" fill="none" opacity=".55"/></pattern>'
   +'<linearGradient id="wr" x1="0" x2="1"><stop offset="0" stop-color="#1d1d21"/><stop offset=".5" stop-color="#34343a"/><stop offset="1" stop-color="#1b1b1f"/></linearGradient></defs>';
  /* greenery */
  [[40,170,-50],[262,172,50],[70,120,-30],[232,122,30],[150,60,0],[100,70,-18],[200,72,18],[30,215,-70],[272,216,70]].forEach(function(l,i){
    s+='<g transform="translate('+l[0]+' '+l[1]+') rotate('+l[2]+')"><ellipse cx="0" cy="-18" rx="11" ry="28" fill="'+(i%2?'#4a8a52':'#3a7544')+'" stroke="#2b5a34" stroke-width="1"/><path d="M0 4V-40" stroke="#2b5a34" stroke-width="1"/></g>';
  });
  /* baby's breath */
  [[24,128],[276,130],[150,40],[52,86],[250,88],[120,50],[182,52],[18,176],[284,178]].forEach(function(b,i){
    s+='<path d="M150 300Q'+((b[0]+150)/2)+' '+(b[1]+80)+' '+b[0]+' '+b[1]+'" stroke="#5c9a62" stroke-width="1.6" fill="none"/>';
    for(var k=0;k<6;k++)s+='<circle cx="'+(b[0]+Math.cos(k*1.05)*7)+'" cy="'+(b[1]+Math.sin(k*1.05)*7)+'" r="3.4" fill="#fff" stroke="#f3d3dc" stroke-width=".6"/>';
  });
  /* stems */
  heads.forEach(function(h){s+='<path d="M150 310Q'+((h[0]+150)/2)+' '+(h[1]+110)+' '+h[0]+' '+h[1]+'" stroke="#3f7a4a" stroke-width="3.4" fill="none" stroke-linecap="round"/>'});
  /* flowers, back to front */
  heads.slice().sort(function(a,b){return a[1]-b[1]}).forEach(function(h,i){
    s+=h[3]==='r'?rose(h[0],h[1],h[2],h[4],.15+i*.14):daisy(h[0],h[1],h[2],.15+i*.14);
  });
  /* wrapping paper */
  s+='<path d="M26 252Q150 232 274 252L170 420H130Z" fill="url(#wr)"/><path d="M26 252Q150 232 274 252L170 420H130Z" fill="url(#dm)"/>'
   +'<path d="M150 244L132 420H170Z" fill="#fff" opacity=".07"/>'
   +'<path d="M26 252Q150 232 274 252" fill="none" stroke="#4a4a52" stroke-width="2"/>'
   +'<path d="M26 252L130 420M274 252L170 420" stroke="#0d0d10" stroke-width="2" opacity=".5"/>';
  /* ribbon */
  s+='<g transform="translate(150 338)"><path d="M-4 8L-30 62L-14 54L-6 70Z" fill="#a3122f"/><path d="M4 8L30 62L14 54L6 70Z" fill="#a3122f"/>'
   +'<ellipse cx="-27" cy="-4" rx="27" ry="15" transform="rotate(-24 -27 -4)" fill="#c81e3c" stroke="#8f1228" stroke-width="1.5"/>'
   +'<ellipse cx="27" cy="-4" rx="27" ry="15" transform="rotate(24 27 -4)" fill="#c81e3c" stroke="#8f1228" stroke-width="1.5"/>'
   +'<ellipse cx="-30" cy="-8" rx="14" ry="4" transform="rotate(-24 -30 -8)" fill="#fff" opacity=".25"/>'
   +'<circle r="10" fill="#d92b48" stroke="#8f1228" stroke-width="1.5"/></g>';
  return s+'</svg>';
}
$('#bq').innerHTML=bouquet();

/* ---------- falling petals ---------- */
function petals(n,set){
  set=set||['🌹','🌸','💗','🌷'];var box=$('#petals');
  for(var i=0;i<n;i++){
    var p=document.createElement('span');p.className='pt';p.textContent=set[Math.floor(Math.random()*set.length)];
    p.style.left=Math.random()*100+'vw';p.style.fontSize=(15+Math.random()*18)+'px';
    p.style.animationDuration=(7+Math.random()*6)+'s';p.style.animationDelay=(Math.random()*3)+'s';
    p.style.setProperty('--dx',(Math.random()*140-70)+'px');p.style.setProperty('--rot',(Math.random()*540-270)+'deg');
    box.appendChild(p);(function(e){setTimeout(function(){e.remove()},14000)})(p);
  }
}
petals(14);
setInterval(function(){petals(3)},5000);

/* ---------- envelope ---------- */
var state=0,hint=$('#hint');
hint.textContent='Envelope par tap karein';
function envClick(){
  if(state===0){
    $('#flip').classList.add('turned');$('#turn').style.display='none';state=1;
    hint.textContent='Seal par tap karke kholein';
  }else if(state===1){
    $('#back').classList.add('open');state=2;
    setTimeout(openLetter,750);
  }else if(state===2){openLetter()}
}
$('#env').addEventListener('click',envClick);
$('#env').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();envClick()}});

/* ---------- letter ---------- */
var built=false,tms=[];
function openLetter(){
  $('#ov').classList.add('on');petals(30,['🌹','🌸','💗']);
  var L=$('#letter');
  if(!built){
    built=true;
    CFG.letter.forEach(function(t){var p=document.createElement('p');p.innerHTML=t;L.appendChild(p)});
    var sg=document.createElement('p');sg.className='sig';sg.textContent=CFG.sign;L.appendChild(sg);
  }
  tms.forEach(clearTimeout);tms=[];
  var ps=L.querySelectorAll('p');
  ps.forEach(function(p,i){
    if(p.classList.contains('show'))return;
    tms.push(setTimeout(function(){p.classList.add('show');if(i>1)p.scrollIntoView({block:'center',behavior:'smooth'})},900+i*2300));
  });
}
$('#close').addEventListener('click',function(){
  $('#ov').classList.remove('on');
  hint.textContent='Khat dobara parhne ke liye envelope par tap karein';
});
</script>
</body>
</html>
